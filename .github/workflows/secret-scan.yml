# Secret scanning, by the estate's shared reusable workflow in flashy-infra.
# The reusable takes two optional inputs (`config`, a .gitleaks.toml path, and
# `version`, the pinned gitleaks release); this repository needs neither.

name: Secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    uses: FlashyLabs/flashy-infra/.github/workflows/secret-scan-reusable.yml@main
