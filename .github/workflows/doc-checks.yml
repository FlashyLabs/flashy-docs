# Documentation checks — the two things this repository can verify about
# itself without a network: that every relative link points at a file that
# exists, and that every JavaScript sample parses.
#
# Both steps fail the job when they fail: nothing here swallows an exit code
# or marks a step as allowed to fail, because a check that cannot go red is
# not a check. Nothing is installed; the tools import only node: builtins.

name: Documentation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Relative links resolve to files in this tree
        run: npm run check:links

      - name: JavaScript samples parse (node --check; TypeScript fences counted, not checked)
        run: npm run check:samples
